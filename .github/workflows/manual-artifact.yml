name: manual-artifact

on: [ workflow_dispatch ]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        minecraft: ['26.2', '26.3']

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true
          cache-cleanup: always

      - name: Gradle build
        run: ./gradlew -Pminecraft_version=${{ matrix.minecraft }} build

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: voxy-artifacts-mc${{ matrix.minecraft }}
          path: build/**/libs/*.jar
          archive: false
